name: demo-2

on: push

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin

    - uses: actions/checkout@v7.0.1

    - run: mvn -B clean compile
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin' 

    - uses: actions/checkout@7.0.1

    - run: mvn -B test

    
  
