name: demo-2

on: push

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/setup-java@v6.1.0
      with:
        java-version: 17

    - uses: actions/checkout@v7.0.1

    - run: mvn clean compile
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/setup-java@v6.1.0
      with:
        java-version: 17

    - uses: actions/checkout@7.0.1

    - run: mvn test

    
  
