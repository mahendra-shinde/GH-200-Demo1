name: metrix-demo

on:
- push
- workflow_dispatch

jobs:
  ## A Template Job
  job-template:
    strategy:
      matrix:
        message: ['World', 'India', 'Maharashtra' ]
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Hello from $MSG'
        env:
          MSG: ${{ matrix.message }}
        
