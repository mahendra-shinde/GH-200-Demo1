name: var-demo
on: 
- push
- workflow_dispatch

jobs:
  job-1:
    runs-on: ubuntu-24.04
    environment: dev
    steps:
      - run: echo Database in Dev $DBNAME
        env:
          DBNAME: ${{ vars.DBNAME }}
  
  job-2:
    runs-on: ubuntu-24.04
    environment: prod
    
    steps:
      - run: echo Database in Prod $DBNAME
        env:
          DBNAME: ${{ vars.DBNAME }}
  
